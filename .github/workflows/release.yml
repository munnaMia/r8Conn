name: Release r8Conn

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            archive: tar.gz
          - os: windows
            arch: amd64
            archive: zip
          - os: darwin
            arch: amd64
            archive: tar.gz
          - os: darwin
            arch: arm64
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and Archive Binary
        shell: bash
        run: |
          BINARY_NAME="r8Conn"
          if [ "${{ matrix.os }}" == "windows" ]; then
            BINARY_NAME="r8Conn.exe"
          fi
          
          # Compile Go binary
          go build -ldflags="-s -w" -o "$BINARY_NAME" .

          # Asset name matching the README links with proper case
          ASSET_NAME="r8Conn-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}"
          
          mkdir -p dist
          if [ "${{ matrix.archive }}" == "zip" ]; then
            zip "dist/$ASSET_NAME" "$BINARY_NAME"
          else
            tar -czf "dist/$ASSET_NAME" "$BINARY_NAME"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}