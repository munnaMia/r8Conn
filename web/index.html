<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>RH Connect - Mobile File Sharing</title>
        <link rel="stylesheet" href="assets/styles/style.css" />
    </head>
    <body>
        <div class="app-container">
            <!-- Header Block -->
            <header class="app-header">
                <div class="header-top">
                    <div class="brand-group">
                        <div class="brand-logo">
                            <!-- Icon Image using local path assets/icons/wifi.svg with inline SVG fallback -->
                            <img class="icon-img lg" src="assets/logo/r8Conn.png" alt="r8Conn" />
                        </div>
                        <div>
                            <h1 class="brand-title">r8Conn</h1>
                            <div class="status-badge">
                                <span>Files without friction</span>
                            </div>
                        </div>
                    </div>

                    <button id="refreshBtn" title="Sync connection" class="btn-icon-square">
                        <img class="icon-img" src="assets/icons/refresh.svg" alt="Refresh" />
                    </button>
                </div>

                <!-- Network Info Bar -->
                <div class="connection-strip">
                    <div class="strip-item">
                        <img class="icon-img sm" src="assets/icons/laptop.svg" alt="Laptop" />
                        <span>192.168.1.105</span>
                    </div>
                    <div class="strip-item" style="color: var(--emerald); font-weight: 700">
                        <img class="icon-img sm" src="assets/icons/bolt.svg" alt="Speed" />
                        <span>54 Mb/s</span>
                    </div>
                </div>

                <!-- Navigation Bar -->
                <nav class="nav-tabs">
                    <button id="tabUpload" onclick="switchTab('upload')" class="tab-btn active">
                        <img class="icon-img" src="assets/icons/upload.svg" alt="Upload" />
                        <span>Upload</span>
                        <span id="uploadBadge" class="tab-badge hidden">0</span>
                    </button>

                    <button id="tabDownload" onclick="switchTab('download')" class="tab-btn">
                        <img class="icon-img" src="assets/icons/download.svg" alt="Download" />
                        <span>Download</span>
                        <span id="downloadBadge" class="tab-badge hidden">0</span>
                    </button>
                </nav>
            </header>

            <!-- App Main Body -->
            <main class="app-main">
                <!-- ==================== UPLOAD SECTION ==================== -->
                <section id="sectionUpload" style="display: flex; flex-direction: column; gap: 16px">
                    <!-- File Dropzone -->
                    <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" multiple style="display: none" onchange="handleFileSelect(event)" />
                        <div class="drop-icon-wrapper">
                            <img class="icon-img lg" src="assets/icons/plus.svg" alt="Add File" />
                        </div>

                        <h3 class="drop-title">Select files to send</h3>
                        <p class="drop-sub">Drag or tap to choose documents and more.</p>
                    </div>

                    <!-- Selected Queue Header -->
                    <div id="selectedFilesHeader" class="section-header hidden">
                        <span class="section-title">
                            <img class="icon-img sm" src="assets/icons/checkbox.svg" alt="Queue" />
                            Queue (<span id="fileCountText">0</span>)
                        </span>
                        <button onclick="clearAllSelected()" class="btn-text-danger">
                            <img class="icon-img sm" src="assets/icons/trash-check.svg" alt="Trash" />
                            Clear all
                        </button>
                    </div>

                    <!-- Queue List -->
                    <div id="selectedFilesList" class="file-list"></div>

                    <!-- Action Button -->
                    <div>
                        <button id="mainActionButton" onclick="handleMainAction()" class="btn-primary-block">
                            <img id="actionIconImg" class="icon-img" src="assets/icons/folder-open.svg" alt="Open" />
                            <span id="actionText">Select Files</span>
                        </button>
                    </div>

                    <!-- Upload History -->
                    <div id="recentUploadsContainer" class="hidden" style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 8px">
                        <div class="section-header" style="margin-bottom: 8px">
                            <span class="section-title">
                                <img class="icon-img sm" src="assets/icons/clock-five.svg" alt="Clock" />
                                Sent to Laptop
                            </span>
                            <span id="completedCount" style="font-size: 0.75rem; color: var(--emerald); font-weight: 700">0 items</span>
                        </div>
                        <div id="recentUploadsList" class="file-list" style="max-height: 160px; overflow-y: auto"></div>
                    </div>
                </section>

                <!-- ==================== DOWNLOAD SECTION ==================== -->
                <section id="sectionDownload" class="hidden" style="display: flex; flex-direction: column; gap: 12px">
                    <!-- Breadcrumbs Navigation -->
                    <div class="breadcrumb-bar">
                        <div class="breadcrumb-trail" id="breadcrumbContainer"></div>
                        <div style="display: flex; gap: 4px">
                            <button id="upDirectoryBtn" onclick="navigateUpDirectory()" title="Parent Directory" class="btn-icon-square hidden">
                                <img class="icon-img sm" src="assets/icons/arrow-small-up.svg" alt="Up" />
                            </button>
                            <button onclick="renderSharedFiles()" title="Refresh Folder" class="btn-icon-square">
                                <img class="icon-img sm" src="assets/icons/refresh.svg" alt="Refresh" />
                            </button>
                        </div>
                    </div>

                    <!-- Search Bar & Controls -->
                    <div class="search-row">
                        <div class="search-box">
                            <img class="icon-img sm" src="assets/icons/search.svg" alt="Search" />
                            <input type="text" id="searchInput" oninput="filterSharedFiles()" placeholder="Search current folder..." />
                        </div>
                        <button onclick="toggleSelectAllShared()" class="btn-secondary">
                            <img class="icon-img sm" src="assets/icons/checkbox.svg" alt="Select All" />
                            Select All
                        </button>
                    </div>

                    <!-- Items Summary Bar -->
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; padding: 0 4px">
                        <span>Items in folder (<span id="sharedItemCount">0</span>)</span>
                        <span id="selectedDownloadCountText" style="color: var(--primary)" class="hidden">0 selected</span>
                    </div>

                    <!-- Shared Files List -->
                    <div id="sharedFilesList" class="file-list"></div>

                    <!-- Download Action Button -->
                    <div style="position: sticky; bottom: 0; padding-top: 8px">
                        <button id="downloadNowBtn" onclick="downloadSelectedFiles()" disabled class="btn-primary-block">
                            <img class="icon-img" src="assets/icons/download.svg" alt="Download" />
                            <span id="downloadBtnText">Select files to download</span>
                        </button>
                    </div>
                </section>
            </main>
        </div>

        <!-- Transfer Modal Overlay -->
        <div id="transferModal" class="modal-backdrop hidden">
            <div class="modal-card">
                <div
                    style="
                        width: 50px;
                        height: 50px;
                        margin: 0 auto 12px auto;
                        border-radius: var(--radius-md);
                        background-color: var(--primary-light);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    "
                >
                    <img id="modalIcon" class="icon-img lg" src="assets/icons/upload.svg" alt="Transfer" />
                </div>
                <h4 id="modalTitle" style="font-size: 1rem; font-weight: 700">Transferring Files</h4>
                <p id="modalSub" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px">Connecting to RH-Laptop...</p>

                <div class="progress-bar-container">
                    <div id="modalProgressBar" class="progress-bar-fill"></div>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); font-family: monospace; font-weight: 600">
                    <span id="modalPercent">0%</span>
                    <span>12.4 MB/s</span>
                </div>

                <button onclick="cancelTransfer()" class="btn-secondary" style="margin: 16px auto 0 auto; padding: 6px 16px">Cancel</button>
            </div>
        </div>

        <!-- Toast Notification Popup -->
        <div id="toast" class="toast">
            <img id="toastIcon" class="icon-img sm" src="assets/icons/checkbox.svg" alt="Check" />
            <span id="toastMessage">Action completed</span>
        </div>

        <script src="assets/scripts/script.js" defer></script>
    </body>
</html>
