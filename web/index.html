<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no" />
        <title>r8Conn</title>

        <link rel="stylesheet" href="assets/styles/style.css" />
    </head>
    <body>
        <div class="app-container">
            <!-- header  -->
            <header class="app-header">
                <!-- Header Block -->
                <div class="header-top">
                    <div class="brand-group">
                        <div class="brand-logo">
                            <img class="icon-img lg" src="assets/logo/r8Conn.png" alt="r8Conn" />
                        </div>
                        <div>
                            <h1 class="brand-title">r8Conn</h1>
                            <div class="moto-title">
                                <span>Files without frictions</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Block -->
                <div class="nav-tabs">
                    <button id="tabUpload" onclick="switchTab('upload')" class="tab-btn active">
                        <img class="icon-img" src="assets/icons/upload.svg" alt="upload" />
                        <span>Upload</span>
                        <span id="uploadBadge" class="tab-badge hidden">0</span>
                    </button>

                    <button id="tabDownload" onclick="switchTab('download')" class="tab-btn">
                        <img class="icon-img" src="assets/icons/download.svg" alt="download" />
                        <span>Download</span>
                        <span id="downloadBadge" class="tab-badge hidden">0</span>
                    </button>
                </div>
            </header>

            <!-- main  -->
            <main>This is body</main>

            <!-- footer -->
            <footer>This is footer</footer>
        </div>

        <script src="assets/scripts/script.js" defer></script>
    </body>
</html>
